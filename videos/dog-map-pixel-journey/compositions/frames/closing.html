<!doctype html><html><body><template>
<div id="closing-root" class="ride-root" data-composition-id="closing" data-width="1920" data-height="1080" data-duration="6">
<style>
@font-face{font-family:DogPixel;src:url(assets/pixel.woff2);font-weight:400}
#closing-root{background:#11182B}

#closing-lockup{position:absolute;left:112px;top:184px;width:940px;font-family:DogPixel,monospace;color:#E7D8B8}
#closing-memory{font-size:36px;line-height:1.5;margin:0 0 20px}

<div id="closing-screen"><img id="closing-last-web" src="assets/web/west-lake-detail.png" alt="西湖真实网页"><img id="closing-map" src="assets/bookends/user-map.png" alt="回到用户的太湖全景地图"></div>

</div>
<script>
(()=>{const tl=gsap.timeline({paused:true});
tl.fromTo('#closing-screen',{scale:2/3,x:48,y:192},{scale:1,x:0,y:0,duration:1.1,ease:'power2.inOut'},0);
tl.fromTo('#closing-map',{opacity:0},{opacity:1,duration:.6,ease:'none'},.9);
tl.to('#closing-screen',{opacity:.48,duration:.6,ease:'none'},1.45);
tl.fromTo('#closing-lockup',{opacity:0,y:16},{opacity:1,y:0,duration:.6,ease:'power2.out'},1.7);
tl.fromTo('#closing-brandline',{opacity:0,y:12},{opacity:1,y:0,duration:.4,ease:'power2.out'},2.65);
tl.fromTo(['#closing-link','#closing-invite'],{opacity:0},{opacity:1,duration:.4,stagger:.15},3.05);
window.__timelines.closing=tl;})();
</script></template></body></html>
