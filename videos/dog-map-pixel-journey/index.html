</head><body>
<div data-hf-id="hf-w77k" id="film" data-composition-id="main" data-start="0" data-duration="35" data-width="1920" data-height="1080">

<div data-hf-id="hf-jp4x" id="memory-scene" class="clip" data-composition-id="scene-04" data-composition-src="compositions/frames/ride-04.html" data-start="21" data-duration="7" data-track-index="1" data-width="1920" data-height="1080"></div>

</div><script>
window.__timelines=window.__timelines||{};
document.getElementById('rider-source').decode().then(()=>{
  const state={t:0};const timeline=gsap.timeline({paused:true});
  timeline.to(state,{t:35,duration:35,ease:'none',onUpdate:()=>drawRideProgress(state.t)},0);
  drawRideProgress(0);window.__timelines.main=timeline;
  if(window.__hfForceTimelineRebind)window.__hfForceTimelineRebind();
});
</script>
